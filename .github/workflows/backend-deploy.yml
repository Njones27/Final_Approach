name: Backend deploy

# Deploys the backend when a change to it reaches main. Beta goes first and
# is checked. Prod follows the same run, and waits for the approval that
# the `prod` environment on GitHub asks for. See docs/backend.md.
#
# No AWS keys are stored in GitHub. A job asks GitHub for a short lived
# token that says where it runs, and the stage's AWS account trades that
# token for one hour of access. The beta account takes the token only from
# the main branch of this repository. The prod account takes it only from a
# job in the `prod` environment, which GitHub starts only from main and only
# after the approval. A pull request or a fork cannot deploy either stage.
on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/actions/deploy-backend/**
      - .github/workflows/backend-deploy.yml
      - .github/workflows/backend-checks.yml
  # Lets the owner run a deploy by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      stage:
        description: How far to deploy. Prod still waits for its approval.
        type: choice
        options:
          - beta
          - prod
        default: beta

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/backend-checks.yml

  beta:
    name: Deploy to beta
    needs: checks
    # A run started by hand from another branch stops here. The beta account
    # would turn its token away in any case.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Official Node.js image, the same one the checks use.
    container: node:22
    # One deploy of a stage at a time. A second one waits, and a running one
    # is never cut off. Each stage has its own group, so a prod deploy that
    # waits for approval never holds up beta.
    concurrency:
      group: backend-deploy-beta
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the job ask GitHub for the token it trades for AWS access.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deploy
        uses: ./.github/actions/deploy-backend
        with:
          stage: beta
          # The role is a repository variable so the account's id is not
          # written in the repo.
          role: ${{ vars.BETA_DEPLOY_ROLE_ARN }}
          role-variable: BETA_DEPLOY_ROLE_ARN

  prod:
    name: Deploy to prod
    # Prod gets only what beta took and passed its check with.
    needs: beta
    # The job is left out until the prod account has a deploy role and the
    # repository variable names it. A run started by hand goes on to prod
    # only when asked to.
    if: >-
      github.ref == 'refs/heads/main'
      && vars.PROD_DEPLOY_ROLE_ARN != ''
      && (github.event_name == 'push' || inputs.stage == 'prod')
    runs-on: ubuntu-latest
    container: node:22
    # GitHub holds the job here until a required reviewer approves it. The
    # environment must allow only main and name a reviewer, because the prod
    # account trusts every job that names it. See docs/backend.md.
    environment: prod
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: This run still holds the backend that is on main
        # An approval can come long after the run started. If main has a
        # newer backend by then, deploying this one would take prod back.
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch --quiet --depth=1 origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- backend; then
            echo "::error::main has a newer backend than this run holds. Approve the newest Backend deploy run instead."
            exit 1
          fi

      - name: Deploy
        uses: ./.github/actions/deploy-backend
        with:
          stage: prod
          role: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
          role-variable: PROD_DEPLOY_ROLE_ARN
