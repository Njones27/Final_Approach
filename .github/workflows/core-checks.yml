name: Core checks

# Shared gate for pull requests and pushes to main (ci.yml). Uses no secrets.
# Everything here runs on Linux, which keeps Xcode Cloud compute hours for the
# builds that reach testers. The iOS app itself is built by Xcode Cloud; see
# docs/ci-cd.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  core-package:
    name: Core package tests
    runs-on: ubuntu-latest
    # Official Swift toolchain image. Keep the version in step with the Swift
    # version of the Xcode release selected in the Xcode Cloud workflows.
    container: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: swift build --package-path Packages/FinalApproachCore

      - name: Test
        run: swift test --package-path Packages/FinalApproachCore

  ci-scripts:
    name: Xcode Cloud script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # shellcheck ships with the hosted Ubuntu runner image.
      - name: Lint ci_scripts
        run: shellcheck FinalApproach/ci_scripts/*.sh

      - name: Scripts are executable
        run: |
          for script in FinalApproach/ci_scripts/*.sh; do
            test -x "$script" || { echo "$script is not executable"; exit 1; }
          done

      - name: Post-clone script writes the selected environment
        run: |
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/FinalApproach/Config"
          CI_PRIMARY_REPOSITORY_PATH="$workdir" APP_ENVIRONMENT=beta API_HOST=api.example.com \
            FinalApproach/ci_scripts/ci_post_clone.sh
          grep -qx 'APP_ENVIRONMENT = beta' "$workdir/FinalApproach/Config/Environment.generated.xcconfig"
          grep -qx 'API_HOST = api.example.com' "$workdir/FinalApproach/Config/Environment.generated.xcconfig"

      - name: Post-clone script takes a stage's backend from the repo
        run: |
          for stage in beta prod; do
            workdir="$(mktemp -d)"
            mkdir -p "$workdir/FinalApproach"
            cp -R FinalApproach/Config "$workdir/FinalApproach/Config"
            CI_PRIMARY_REPOSITORY_PATH="$workdir" APP_ENVIRONMENT="$stage" FinalApproach/ci_scripts/ci_post_clone.sh
            generated="$workdir/FinalApproach/Config/Environment.generated.xcconfig"
            grep -qx "#include \"Stages/${stage}.xcconfig\"" "$generated"
            # Nothing set by hand may replace the stage's own host.
            if grep -q '^API_HOST' "$generated"; then
              echo "expected no API_HOST line when the variable is unset"; exit 1
            fi
            # The include must come before the lines that replace its values.
            test "$(grep -n '^#include' "$generated" | cut -d: -f1)" -lt "$(grep -n '^APP_ENVIRONMENT' "$generated" | cut -d: -f1)"
          done

      - name: A build made in Xcode takes the beta backend
        run: |
          config=FinalApproach/Config/App.xcconfig
          grep -qx 'APP_ENVIRONMENT = beta' "$config"
          grep -qx '#include "Stages/beta.xcconfig"' "$config"
          # Nothing in this file may empty or replace the stage's values.
          if grep -Eq '^(API_HOST|AUTH_HOST|AUTH_CLIENT_ID)' "$config"; then
            echo "$config must take its backend from the stage file only"; exit 1
          fi
          # What Xcode Cloud writes must come last, so that it wins.
          test "$(grep -n '^#include "Stages/' "$config" | cut -d: -f1)" -lt "$(grep -n '^#include? "Environment.generated.xcconfig"' "$config" | cut -d: -f1)"
          test "$(tail -n 1 "$config")" = '#include? "Environment.generated.xcconfig"'

      - name: Every stage file holds bare values only
        run: |
          for file in FinalApproach/Config/Stages/*.xcconfig; do
            for key in API_HOST AUTH_HOST AUTH_CLIENT_ID; do
              grep -Eq "^${key} = [A-Za-z0-9.-]+$" "$file" || { echo "$file needs a bare ${key}"; exit 1; }
            done
            if grep -Ev '^(//.*|[A-Z_]+ = [A-Za-z0-9.-]+)?$' "$file"; then
              echo "$file holds a line that is not a comment or a bare setting"; exit 1
            fi
          done

      - name: Post-clone script rejects a missing or unknown environment
        run: |
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/FinalApproach/Config"
          if CI_PRIMARY_REPOSITORY_PATH="$workdir" FinalApproach/ci_scripts/ci_post_clone.sh; then
            echo "expected a failure when APP_ENVIRONMENT is unset"; exit 1
          fi
          if CI_PRIMARY_REPOSITORY_PATH="$workdir" APP_ENVIRONMENT=staging FinalApproach/ci_scripts/ci_post_clone.sh; then
            echo "expected a failure for an unknown environment"; exit 1
          fi
